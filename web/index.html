<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C Tokenizer + Parser — Web Interface</title>
<style>
  :root{--bg:#f6f8fa;--card:#fff;--muted:#666}
  body{font-family:Inter,Segoe UI,Arial; background:var(--bg); margin:0; padding:24px}
  .wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 420px;gap:20px}
  .card{background:var(--card);padding:18px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,0.06)}
  h1{margin:0 0 8px;font-size:20px}
  p.small{margin:0 0 12px;color:var(--muted)}
  textarea{width:100%;height:380px;padding:12px;border-radius:8px;border:1px solid #ddd;resize:vertical;font-family:Menlo,monospace}
  .controls{display:flex;gap:8px;margin-top:12px}
  button{padding:10px 12px;border-radius:8px;border:0;background:#0b76ef;color:#fff;cursor:pointer}
  #output{white-space:pre-wrap;font-family:Menlo,monospace;background:#eee;padding:12px;border-radius:8px;max-height:380px;overflow:auto;margin-top:12px}
  @media(max-width:980px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>C Tokenizer + Parser</h1>
    <p class="small">এই টুলে তুমি C কোড পেস্ট করে টোকেন এবং parse আউটপুট দেখতে পারবে।</p>

    <textarea id="code" placeholder="এখানে তোমার C কোড পেস্ট করো..."></textarea>

    <div class="controls">
      <button id="runBtn">Run</button>
      <button id="clearBtn" style="background:#777">Clear</button>
    </div>

    <div id="output"></div>
  </div>

  <div class="card">
    <h1>Notes</h1>
    <p class="small">
      1. এটি Flex + Bison backend ব্যবহার করে।<br>
      2. Comments ও whitespace handle করা হয়েছে।<br>
      3. ফাইল বা interactive mode দুটোই সমর্থিত।
    </p>
  </div>
</div>

<script src="index.js"></script>
</body>
</html>
